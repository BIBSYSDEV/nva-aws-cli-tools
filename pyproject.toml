[project]
name = "nva-aws-cli-tools"
version = "0.1.0"
description = "Python scripts using aws-cli"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.67",
    "click>=8.4.2",
    "requests>=2.34.2",
    "rich>=14.2.0",
    "tabulate>=0.10.0",
    "tqdm>=4.69.1",
    "deepdiff>=9.1.0",
    "uuid>=1.30",
    "tenacity>=9.1.4",
    "python-json-logger>=4.1.0",
    "polars>=1.42.1",
    "xlsxwriter>=3.2.9",
    "fastexcel>=0.20.2",
]

[tool.pytest.ini_options]
pythonpath = "."
addopts = "--cov=commands --cov=cli --cov-report=term-missing --cov-fail-under=70"

[dependency-groups]
dev = [
    "boto3-stubs[codepipeline,cognito-idp,dynamodb,iam,lambda,s3,secretsmanager,sqs,ssm,sts]>=1.43.63",
    "moto[awslambda-simple,cognitoidp,ssm]>=5.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]
